name: community_package
description: Community feedback screens for the My-life Plus apps, backed by a Cloudflare Worker.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

# Runtime ranges are kept wide so each host app's SDK can pick the newest
# version it supports.
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  freezed_annotation: ^3.1.0
  get: ">=4.6.6 <5.0.0"
  http: ^1.2.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
