name: community_package
description: Community feedback screens for the My-life Plus apps, backed by a Cloudflare Worker.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

# Runtime ranges are kept wide so each host app's SDK can pick the newest
# version it supports.
dependencies:
  # 0.6 needs Flutter 3.47 and Android API 24; 0.5 covers older SDKs.
  android_id: ">=0.5.0 <0.7.0"
  crypto: ^3.0.3
  # 11.5 is the first with the iOS model name; 12 needs Android Gradle
  # Plugin 8.12.1, newer than SpaceTime, Inventory and money use.
  device_info_plus: ">=11.5.0 <12.0.0"
  flutter:
    sdk: flutter
  # 11 needs Dart 3.8 and Android API 24; 10 covers older SDKs.
  flutter_secure_storage: ">=10.0.0 <12.0.0"
  flutter_svg: ^2.0.10
  freezed_annotation: ^3.1.0
  get: ">=4.6.6 <5.0.0"
  http: ^1.2.0
  # 9 needs Android Gradle Plugin 8.12.1, like device_info_plus 12.
  package_info_plus: ">=8.0.0 <9.0.0"
  json_annotation: ^4.9.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  flutter_localizations:
    sdk: flutter

flutter:
  assets:
    - assets/icons/
